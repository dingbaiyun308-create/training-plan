const STORE_KEY='training_stage3_lower_back_v1';
const APP_VERSION='20260729-stage3-final-v1';
let state=loadState();
let currentSession=DATA.sessions[0]?.id;
function loadState(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{sets:{},fields:{},sessions:{},cycle:{},profile:{weightKg:DATA.profile.weightKg||88}}}catch(e){return {sets:{},fields:{},sessions:{},cycle:{},profile:{weightKg:88}}}}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));renderKPIs();}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function setPath(obj,path,val){obj[path]=val;save();}
function getSet(id,group){return state.sets[id+':'+group]||'todo'}
function toggleSet(id,group){const k=id+':'+group;const v=state.sets[k]||'todo';state.sets[k]=v==='todo'?'done':v==='done'?'skip':'todo';save();renderTraining();renderWarmup();}
function fieldKey(id,name){return id+':'+name}
function setField(id,name,val){state.fields[fieldKey(id,name)]=val;save();}
function getField(id,name){return state.fields[fieldKey(id,name)]||''}
function rowsForSession(rows){return rows.filter(r=>r.sessionId===currentSession)}
function session(){return DATA.sessions.find(s=>s.id===currentSession)||DATA.sessions[0]}
function setSession(id){currentSession=id;renderAll();}
function renderTabs(){document.getElementById('sessionTabs').innerHTML=DATA.sessions.map(s=>`<button class="session ${s.id===currentSession?'active':''}" onclick="setSession('${s.id}')"><b>${s.week} ${s.day}</b><small>${s.type}</small></button>`).join('')}
function renderKPIs(){const total=DATA.trainingRows.reduce((n,r)=>n+(+r.sets||0),0)+DATA.warmupRows.length;let done=0;for(const r of DATA.trainingRows){for(const g of r.groupChecks||[]) if(getSet(r.id,g)==='done') done++}for(const r of DATA.warmupRows) if(getSet(r.id,'完成')==='done') done++;const pct=total?Math.round(done/total*100):0;const main=DATA.trainingRows.filter(r=>['深蹲','卧推','硬拉'].includes(r.exercise));document.getElementById('kpis').innerHTML=[['训练次数',DATA.sessions.length],['动作行',DATA.trainingRows.length],['完成度',pct+'%'],['体重',state.profile?.weightKg||DATA.profile.weightKg||88+' kg']].map(x=>`<div class="panel kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}
function renderHome(){const main=DATA.trainingRows.filter(r=>['深蹲','卧推','硬拉','保加利亚分腿蹲'].includes(r.exercise));document.getElementById('home').innerHTML=`<section class="panel"><h2>主项进度</h2><div class="table summary"><div class="trow head"><div class="cell">周次</div><div class="cell">深蹲</div><div class="cell">卧推</div><div class="cell">硬拉</div></div>${DATA.sessions.filter(s=>s.day==='周一').map(s=>{const week=s.week;const sq=DATA.trainingRows.find(r=>r.week===week&&r.exercise==='深蹲');const bp=DATA.trainingRows.filter(r=>r.week===week&&r.exercise==='卧推').map(r=>r.day+r.plannedWeight+' '+r.sets+'×'+r.repsOrTime).join(' / ');const dl=DATA.trainingRows.find(r=>r.week===week&&r.exercise==='硬拉');return `<div class="trow"><div class="cell">${week}</div><div class="cell">${sq.plannedWeight} ${sq.sets}×${sq.repsOrTime}</div><div class="cell">${bp}</div><div class="cell">${dl.plannedWeight} ${dl.sets}×${dl.repsOrTime}</div></div>`}).join('')}</div></section><section class="panel"><h2>当前训练日</h2><p class="sub">${session().week} ${session().day}｜${session().type}</p><div class="tools" style="margin-top:10px"><button class="btn primary" onclick="showView('training')">开始训练</button><button class="btn" onclick="showView('warmup')">热身打勾</button></div></section>`}
function rowCard(r){const sets=(r.groupChecks||[]).map(g=>`<button class="setbtn ${getSet(r.id,g)}" onclick="toggleSet('${r.id}','${g}')">${g}：${getSet(r.id,g)==='done'?'✓':getSet(r.id,g)==='skip'?'跳过':'待做'}</button>`).join('');return `<div class="rowcard"><div class="row-top"><div><div class="name">${r.order}. ${r.exercise}</div><div class="plan">${r.notes||''}</div></div><div class="plan">${r.plannedWeight}｜${r.sets}组×${r.repsOrTime}｜RPE ${r.targetRPE}</div><div class="plan">休息<br>${r.rest||''}</div><div class="plan">ID<br>${r.id}</div></div><div class="sets">${sets}</div><div class="fields"><label><span>实际重量</span><input value="${getField(r.id,'实际重量')}" onchange="setField('${r.id}','实际重量',this.value)"></label><label><span>实际次数</span><input value="${getField(r.id,'实际次数')}" onchange="setField('${r.id}','实际次数',this.value)"></label><label><span>RPE</span><input value="${getField(r.id,'RPE')}" onchange="setField('${r.id}','RPE',this.value)"></label><label><span>异常/备注</span><input value="${getField(r.id,'异常/备注')}" onchange="setField('${r.id}','异常/备注',this.value)"></label></div></div>`}
function renderTraining(){const rows=rowsForSession(DATA.trainingRows);document.getElementById('training').innerHTML=`<section class="panel"><h2>${session().week} ${session().day}｜训练打勾</h2><p class="sub">${session().type}</p></section>`+rows.map(rowCard).join('')+sessionSummary();}
function renderWarmup(){const rows=rowsForSession(DATA.warmupRows);document.getElementById('warmup').innerHTML=`<section class="panel"><h2>${session().week} ${session().day}｜热身</h2></section>`+rows.map(r=>`<div class="warm-row"><div><b>${r.module}</b></div><div class="plan">${r.content}</div><button class="setbtn ${getSet(r.id,'完成')}" onclick="toggleSet('${r.id}','完成')">${getSet(r.id,'完成')==='done'?'✓ 完成':getSet(r.id,'完成')==='skip'?'跳过':'待做'}</button></div>`).join('')}
function sessionSummary(){const id=session().id;const s=state.sessions[id]||{};function inp(k,ph=''){return `<label><span>${k}</span><input value="${s[k]||''}" placeholder="${ph}" onchange="state.sessions['${id}']=state.sessions['${id}']||{};state.sessions['${id}']['${k}']=this.value;save()"></label>`}return `<section class="panel"><h2>训练日总结</h2><div class="fields">${inp('日期')}${inp('总时长min')}${inp('整体RPE')}${inp('疼痛/不适')}</div><label style="margin-top:8px;display:block"><span>当日总结</span><textarea onchange="state.sessions['${id}']=state.sessions['${id}']||{};state.sessions['${id}']['当日总结']=this.value;save()">${s['当日总结']||''}</textarea></label></section>`}
function renderSummary(){const fields=['结束体重','腰围/腹部变化','深蹲最佳工作组','硬拉最佳工作组','卧推最佳工作组','引体进展','平均训练时长','恢复情况','疼痛或不适','下一阶段第一优先级'];document.getElementById('summary').innerHTML=`<section class="panel"><h2>周期总结</h2><div class="fields">${fields.map(k=>`<label><span>${k}</span><input value="${state.cycle[k]||''}" onchange="state.cycle['${k}']=this.value;save()"></label>`).join('')}</div></section>`}
function renderRules(){document.getElementById('rules').innerHTML=`<section class="panel"><h2>执行规则</h2><div class="table rules">${Object.entries(DATA.rules).map(([k,v])=>`<div class="trow"><div class="cell"><b>${k}</b></div><div class="cell">${v}</div></div>`).join('')}</div></section><section class="panel"><h2>备份</h2><p class="sub">导出包含完整计划快照、动作字典、原始状态、训练记录和热身记录。可以脱离软件直接阅读。</p><div class="tools" style="margin-top:10px"><button class="btn primary" onclick="exportBackup()">导出完整备份</button><label class="btn">导入备份<input type="file" accept="application/json" style="display:none" onchange="importBackup(event)"></label><button class="btn" onclick="if(confirm('确定清空当前第三阶段本机记录？')){localStorage.removeItem(STORE_KEY);state=loadState();renderAll();}">清空本机记录</button></div></section>`}
function readableTraining(){return DATA.trainingRows.map(r=>({id:r.id,week:r.week,day:r.day,sessionType:r.sessionType,sessionId:r.sessionId,order:r.order,exercise:r.exercise,planned:{weight:r.plannedWeight,sets:r.sets,repsOrTime:r.repsOrTime,targetRPE:r.targetRPE,rest:r.rest,notes:r.notes},actual:{setStatus:Object.fromEntries((r.groupChecks||[]).map(g=>[g,getSet(r.id,g)])),actualWeight:getField(r.id,'实际重量'),actualReps:getField(r.id,'实际次数'),RPE:getField(r.id,'RPE'),notes:getField(r.id,'异常/备注')}}))}
function readableWarmup(){return DATA.warmupRows.map(r=>({id:r.id,week:r.week,day:r.day,sessionType:r.sessionType,sessionId:r.sessionId,order:r.order,module:r.module,content:r.content,status:getSet(r.id,'完成')}))}
function exportBackup(){const dict=Object.fromEntries(DATA.trainingRows.map(r=>[r.id,r.exercise]));const backup={schemaVersion:4,app:DATA.title,appVersion:APP_VERSION,planId:DATA.planId,exportedAt:new Date().toISOString(),storeKey:STORE_KEY,profile:state.profile||DATA.profile,planSnapshot:DATA,exerciseDictionary:dict,state,sessionSummaries:state.sessions||{},cycleSummary:state.cycle||{},records:{training:readableTraining(),warmup:readableWarmup()}};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='第3阶段训练记录_完整备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('已导出完整备份：12次训练、76个动作行、84个热身行')}
function importBackup(e){const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);const incoming=obj.state||obj;if(!confirm('导入备份会覆盖当前本机第三阶段记录。继续？'))return;state={sets:incoming.sets||incoming,fields:incoming.fields||{},sessions:incoming.sessions||{},cycle:incoming.cycle||{},profile:incoming.profile||obj.profile||DATA.profile};save();renderAll();toast(obj.planSnapshot?'完整备份已导入':'旧版状态备份已兼容导入')}catch(err){alert('导入失败：'+err.message)}};reader.readAsText(f);e.target.value=''}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id));window.scrollTo({top:0,behavior:'smooth'})}
function validatePlan(){const names=DATA.trainingRows.map(r=>r.exercise);const bad=['站立划船','辅助引体','史密斯','暂停深蹲','顶组','回退组','轻顶组'].filter(x=>names.some(n=>n.includes(x)));if(bad.length)console.error('发现禁用动作名',bad);if(DATA.sessions.length!==12)console.error('训练次数不是12');}
function renderAll(){renderTabs();renderKPIs();renderHome();renderTraining();renderWarmup();renderSummary();renderRules();}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
validatePlan();renderAll();
</script>
</body></html>
