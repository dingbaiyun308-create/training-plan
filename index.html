<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1764d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="训练计划器">
  <meta name="description" content="第4阶段肌肥大与肌肉耐力训练计划，12次训练，本机记录。">
  <title>第4阶段 · 训练计划器</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/lucide.min.js"></script>
  <script defer src="./plan-data.js"></script>
  <script defer src="./core.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <img src="./icons/icon-192.png" width="46" height="46" alt="训练计划器">
      <div class="brand"><p class="eyebrow">第4阶段</p><h1>训练计划器</h1></div>
      <div class="header-end"><span id="saveStatus" role="status">本机记录</span><button class="icon-button" data-action="view" data-view="records" aria-label="导出与备份" title="导出与备份"><i data-lucide="download"></i></button></div>
    </header>
    <div id="storageWarning" class="notice warning" hidden></div>
    <nav class="main-nav" aria-label="功能栏目">
      <button data-action="view" data-view="home" aria-current="page">首页</button>
      <button data-action="view" data-view="warmup">热身</button>
      <button data-action="view" data-view="training">训练</button>
      <button data-action="view" data-view="nutrition">营养</button>
      <button data-action="view" data-view="records">记录</button>
      <button data-action="view" data-view="plan">计划</button>
    </nav>
    <section id="sessionPicker" class="session-picker" aria-label="选择训练">
      <div class="section-line"><span id="roundLabel">第1轮</span><span class="muted">A / B / C · 共12练</span></div>
      <div class="session-list" id="sessionList"></div>
    </section>
    <main id="main" tabindex="-1"></main>
    <footer class="app-footer"><span>第4阶段 · 本机保存</span><span>2026.09.09</span></footer>
  </div>
  <aside id="timerBar" class="timer-bar" hidden aria-label="组间休息计时"></aside>
  <dialog id="editor"><form id="editorForm"><div class="dialog-head"><h2 id="editorTitle"></h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭" title="关闭"><i data-lucide="x"></i></button></div><div id="editorBody"></div><div class="dialog-actions"><button type="button" class="button" data-action="close-dialog">取消</button><button class="button primary" type="submit">保存调整</button></div></form></dialog>
  <dialog id="exportDialog"><div class="dialog-head"><h2>给 GPT 的训练记录</h2><button class="icon-button" data-action="close-export" aria-label="关闭" title="关闭"><i data-lucide="x"></i></button></div><textarea id="exportText" readonly aria-label="训练记录文本"></textarea><div class="dialog-actions"><button class="button" data-action="copy-export"><i data-lucide="copy"></i>复制</button><button class="button primary" data-action="download-text"><i data-lucide="download"></i>下载 TXT</button></div></dialog>
  <input id="backupFile" type="file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>请启用 JavaScript 后打开训练计划器。</noscript>
</body>
</html>
