<style id="professional-ui">
:root{
  --bg:#f3f6fa;
  --panel:#ffffff;
  --ink:#172033;
  --muted:#667085;
  --line:#dce3ed;
  --blue:#1677ff;
  --blue2:#0ea5e9;
  --cyan:#0891b2;
  --soft:#edf5ff;
  --ok:#16a34a;
  --skip:#ea7a1a;
  --bad:#dc2626;
  --shadow:0 4px 14px rgba(23,32,51,.06);
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-weight:400;letter-spacing:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid rgba(22,119,255,.7);outline-offset:2px}
.app{max-width:1040px;padding:16px 16px 96px}
.top{padding:4px 0 14px}
.brand{gap:12px}
.brand img{width:48px;height:48px;border-radius:8px;box-shadow:0 3px 10px rgba(23,32,51,.14)}
.brand-copy{min-width:0}
.eyebrow{margin-bottom:3px;color:var(--blue);font-size:12px;font-weight:800;line-height:1.2}
h1{font-size:25px;line-height:1.18;font-weight:850}
h2{font-size:19px;line-height:1.35}
h3{font-size:16px;line-height:1.35}
.sub{margin-top:4px;font-size:14px;line-height:1.5}
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;padding:10px 12px;border-color:#c9ddf8;background:#f7fbff;color:#23446f;font-size:14px;font-weight:700;line-height:1.4}
.notice strong{color:#17365f}
.notice small{color:#6d7f98;font-weight:600;text-align:right}
.nav{margin:0 0 14px;padding:0;background:transparent;border:0;backdrop-filter:none}
.tabbar{gap:4px;padding:4px;border:1px solid var(--line);border-radius:8px;background:#e9eef5;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;min-width:84px;min-height:42px;padding:9px 13px;border:0;background:transparent;border-radius:6px;color:#465267;font-size:14px;font-weight:750;scroll-snap-align:start}
.tab.active{background:#fff;color:#1158b5;box-shadow:0 1px 5px rgba(23,32,51,.1)}
.session-label-row{display:flex;align-items:center;justify-content:space-between;margin:13px 2px 7px;color:var(--muted);font-size:13px;font-weight:700}
.session-label-row strong{color:#38455a;font-weight:800}
.sessions{gap:8px;margin-top:0;padding:1px 1px 8px;scroll-padding-left:1px;scroll-snap-type:x mandatory}
.session{flex:0 0 150px;min-height:70px;padding:10px 11px;border-color:#d7e0ec;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(23,32,51,.04);scroll-snap-align:start}
.session b{font-size:14px;line-height:1.35;font-weight:850}
.session small{font-size:12px;line-height:1.35;font-weight:650}
.session.active{background:var(--blue);border-color:var(--blue);box-shadow:0 5px 14px rgba(22,119,255,.2)}
.content{gap:14px}
.view.active{gap:12px}
.panel{padding:15px;border-color:var(--line);border-radius:8px;box-shadow:var(--shadow)}
.cols4{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{min-height:116px;display:flex;flex-direction:column;justify-content:center}
.kpi b{margin-top:2px;font-size:23px;line-height:1.2}
.kpi span{font-size:13px;line-height:1.35}
.progress{height:7px;margin:10px 0 5px}
.bar{background:var(--blue)}
.session-head{align-items:flex-start}
.badge{border-radius:6px;padding:4px 8px;background:#e8f2ff;color:#135cb7;font-size:12px;font-weight:800}
.badge.warn{background:#fff3d6;color:#8a5700}
.section-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.section-heading-copy{min-width:0}
.section-heading .sub{max-width:640px}
.list{gap:10px}
.rowcard{padding:14px;border-color:var(--line);box-shadow:var(--shadow)}
.exercise-head{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:start;gap:10px}
.exercise-order{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#e8f2ff;color:#125bb7;font-size:13px;font-weight:850}
.exercise-title{padding-top:1px}
.name{font-size:17px;line-height:1.35;font-weight:850;overflow-wrap:anywhere}
.stage-pill{display:inline-flex;margin-top:5px;padding:3px 7px;border-radius:5px;background:#f0f2f5;color:#586579;font-size:12px;font-weight:700}
.target-box{min-width:105px;padding:8px 9px;border:1px solid #dfe6ef;border-radius:7px;background:#f7f9fc;text-align:right}
.target-box strong{display:block;color:#172033;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.target-box small{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.3}
.cue{margin:10px 0 0;padding:9px 10px;border-left:3px solid #88bfff;background:#f7fbff;color:#48576c;font-size:13px;line-height:1.5}
.sets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:1px}
.setbtn{width:100%;min-width:0;min-height:44px;padding:7px 4px;border-radius:7px;background:#f8fafc;font-size:13px;flex-flow:row nowrap;gap:4px;white-space:nowrap}
.setbtn .check-label{flex:0 0 auto;font-weight:800;white-space:nowrap}
.checkdot{width:23px;height:23px;flex-basis:23px;border-width:2px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:2px}
.fields label{display:block}
.fields label>span{margin-bottom:5px;color:#586579;font-size:12px;font-weight:700}
.field-wide{grid-column:1/-1}
input,textarea,select{min-height:44px;border-color:#d5deea;border-radius:7px;padding:10px 11px;background:#fbfcfe}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(22,119,255,.18);border-color:#68a8ff;background:#fff}
textarea{min-height:72px}
.inputline{grid-template-columns:minmax(0,1fr) 54px;gap:7px}
.mini{min-width:54px;min-height:44px;padding:8px 7px;border-radius:7px;background:#eaf3ff;color:#145ebc;font-size:13px}
.warm-card{display:grid;gap:11px}
.warm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.warm-title{display:grid;gap:5px}
.warm-info{display:grid;grid-template-columns:.7fr 1fr 1.25fr;gap:8px}
.info-block{padding:9px 10px;border-radius:7px;background:#f7f9fc;color:#425067;font-size:13px;line-height:1.45}
.info-block span{display:block;margin-bottom:3px;color:#78869a;font-size:11px;font-weight:750}
.warm-head .setbtn,.track-head .setbtn{width:auto;min-width:96px}
.track-row{padding:14px;box-shadow:var(--shadow)}
.track-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.detail-list{display:grid;margin-top:10px;border-top:1px solid var(--line)}
.detail-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px solid var(--line);line-height:1.5}
.detail-row:last-child{border-bottom:0}
.detail-row dt{color:#344054;font-size:14px;font-weight:800}
.detail-row dd{margin:0;color:#657187;font-size:14px}
.tools{gap:8px}
.btn{border-radius:7px;font-size:14px}
.btn.primary{background:var(--blue)}
.rules .cell{font-size:13px}
.rules .head{background:#edf5ff;color:#194d8c}
.rule-green{color:#176b39}.rule-yellow{color:#8a5700}.rule-red{color:#a42a2a}.rule-next{color:#334155}
.sheet{background:rgba(23,32,51,.42)}
.sheet-panel{border-radius:8px 8px 0 0;padding:16px}
.toast{border-radius:8px;background:#172033}
@media(max-width:760px){
  .app{padding:12px 12px calc(92px + env(safe-area-inset-bottom))}
  .top{padding-top:2px}
  .brand img{width:44px;height:44px}
  .eyebrow{font-size:11px}
  h1{font-size:21px}
  .notice{align-items:flex-start;font-size:13px}
  .notice small{max-width:112px}
  .nav{margin-left:0;margin-right:0;padding-left:0;padding-right:0}
  .tab{min-width:76px;padding-left:12px;padding-right:12px}
  .session{flex-basis:142px}
  .cols4{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .kpi{min-height:104px;padding:12px}
  .kpi b{font-size:21px}
  .section-heading,.session-head{display:flex}
  .exercise-head{grid-template-columns:30px minmax(0,1fr)}
  .target-box{grid-column:2;min-width:0;width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left}
  .target-box small{margin:0 0 0 8px;text-align:right}
  .row-top{grid-template-columns:1fr}
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .warm-row{grid-template-columns:1fr}
  .warm-info{grid-template-columns:1fr}
  .detail-row{grid-template-columns:1fr;gap:3px}
  .tools{display:grid;grid-template-columns:1fr 1fr}
  .tools .btn{width:100%}
  .tools .primary{grid-column:1/-1}
  .rules .trow{display:grid}
  .rules .head{display:none}
  .rules .cell{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:10px 11px}
  .rules .cell::before{content:attr(data-label);color:#7b8798;font-size:12px;font-weight:800}
  .rules .cell:first-child{display:block;background:#f7f9fc;font-size:15px}
  .rules .cell:first-child::before{display:none}
}
@media(max-width:370px){
  .app{padding-left:10px;padding-right:10px}
  .notice{display:grid;gap:3px}
  .notice small{max-width:none;text-align:left}
  .tab{min-width:72px}
  .session{flex-basis:136px}
  .sets{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fields{grid-template-columns:1fr}
  .field-wide{grid-column:auto}
}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><img src="icons/icon-192.png" alt="训练计划器图标" /><div class="brand-copy"><div class="eyebrow">4周 · 12次训练</div><h1>第3阶段训练计划器</h1><p class="sub">每周三练 · 强度控制修订版</p></div></div><div class="notice" id="startPoint"></div></header>
  <nav class="nav" aria-label="训练计划栏目"><div class="tabbar"><button class="tab active" data-view="home">首页</button><button class="tab" data-view="warmup">热身</button><button class="tab" data-view="training">训练</button><button class="tab" data-view="recovery">恢复</button><button class="tab" data-view="pullup">引体</button><button class="tab" data-view="rules">规则</button></div><div class="session-label-row"><strong>选择训练日</strong><span id="sessionPosition"></span></div><div class="sessions" id="sessionTabs"></div></nav>
  <main class="content"><section class="grid cols4" id="kpis"></section><section class="view active" id="home"></section><section class="view" id="warmup"></section><section class="view" id="training"></section><section class="view" id="recovery"></section><section class="view" id="pullup"></section><section class="view" id="rules"></section></main>

const STORE_KEY = 'training-plan-phase3-v1';
let state = loadState(); let currentSession = state.currentSession || DATA.sessions[0]?.id || ''; let activeView = 'home'; let pickerTarget = null; const $ = s => document.querySelector(s);
function h(v){return String(v ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function loadState(){try{return JSON.parse(localStorage.getItem(STORE_KEY)) || {}}catch{return {}}} function saveState(){localStorage.setItem(STORE_KEY, JSON.stringify(state)); renderKpis();}
function markKey(kind,id,group=''){return group ? `${kind}:${id}:${group}` : `${kind}:${id}`;} function getMark(kind,id,group,def='☐'){return state[markKey(kind,id,group)] || def || '☐';} function setMark(kind,id,group,value){state[markKey(kind,id,group)] = value; saveState();}
function fieldKey(kind,id,name){return `field:${kind}:${id}:${name}`;} function getField(kind,id,name,def=''){return state[fieldKey(kind,id,name)] ?? def ?? '';} function setField(kind,id,name,value){state[fieldKey(kind,id,name)] = value; saveState();}
function cycle(value){return value === '☑' ? '跳过' : value === '跳过' ? '☐' : '☑';} function markLabel(value){return value === '☑' ? '完成' : value === '跳过' ? '跳过' : '未完成';} function pct(done,total){return total ? Math.round(done / total * 100) : 0;}
function sessionRows(rows){return rows.filter(r => r.sessionId === currentSession);} function currentSessionObj(){return DATA.sessions.find(x=>x.id===currentSession) || DATA.sessions[0] || {};} function dayKind(day){if(String(day).includes('周一'))return '周一'; if(String(day).includes('周三'))return '周三'; if(String(day).includes('周五'))return '周五'; return '';}
function init(){ $('#startPoint').innerHTML = `<strong>训练周期 08.03 - 08.28</strong><small>周一 / 周三 / 周五</small>`; document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view))); $('#pickerCancel').addEventListener('click', closePicker); $('#pickerApply').addEventListener('click', applyPicker); $('#pickerSheet').addEventListener('click', e => { if(e.target.id === 'pickerSheet') closePicker(); }); if('serviceWorker' in navigator && location.protocol !== 'file:'){ window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{})); } }
function switchView(view){activeView=view; document.querySelectorAll('.tab').forEach(b=>{const selected=b.dataset.view===view; b.classList.toggle('active',selected); b.setAttribute('aria-selected',selected?'true':'false'); if(selected) requestAnimationFrame(()=>b.scrollIntoView({block:'nearest',inline:'center'}));}); document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id===view));}
function formatSessionDay(day){const match=String(day).match(/(\d+)\/(\d+)\s*(周.)?/); return match?`${match[1]}月${match[2]}日${match[3]?` · ${match[3]}`:''}`:String(day);}
function renderSessions(){ const selectedIndex=Math.max(0,DATA.sessions.findIndex(s=>s.id===currentSession)); $('#sessionPosition').textContent=`${selectedIndex+1} / ${DATA.sessions.length}`; $('#sessionTabs').innerHTML = DATA.sessions.map((s,i) => `<button class="session ${s.id===currentSession?'active':''}" data-session="${h(s.id)}" aria-pressed="${s.id===currentSession?'true':'false'}"><b>${h(s.week)} · 第${(i%3)+1}练</b><small>${h(formatSessionDay(s.day))}</small></button>`).join(''); $('#sessionTabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{currentSession=b.dataset.session; state.currentSession=currentSession; saveState(); renderSessions(); renderHome(); renderTraining(); renderWarmup(); renderRecovery(); renderPullup(); renderKpis(); switchView(activeView);})); const selected=$('#sessionTabs .session.active'); if(selected) requestAnimationFrame(()=>selected.scrollIntoView({block:'nearest',inline:'center'})); }
function allGroupItems(rows=DATA.trainingRows){const out=[]; for(const r of rows){for(const g of r.groupChecks) out.push([r,g]);} return out;} function availableStats(items){let done=0, skip=0; for(const [r,g] of items){const m=getMark('set',r.id,g); if(m==='☑') done++; if(m==='跳过') skip++;} return {done, skip, total: items.length, available: Math.max(0, items.length-skip)};} function warmStats(rows=DATA.warmupRows){let done=0, skip=0; for(const r of rows){const m=getMark('warm',r.id,''); if(m==='☑') done++; if(m==='跳过') skip++;} return {done, skip, total: rows.length, available: Math.max(0, rows.length-skip)};} function recoveryStats(){let done=0; for(const r of DATA.recoveryRows){if(getMark('recovery',r.id,'')==='☑') done++;} return {done,total:DATA.recoveryRows.length};}
function renderKpis(){ const all=availableStats(allGroupItems()); const cur=availableStats(allGroupItems(sessionRows(DATA.trainingRows))); const warm=warmStats(sessionRows(DATA.warmupRows)); const rec=recoveryStats(); const items=[['总训练组',`${all.done} / ${all.available}`,pct(all.done,all.available),`跳过 ${all.skip}`],['本次训练',`${cur.done} / ${cur.available}`,pct(cur.done,cur.available),`跳过 ${cur.skip}`],['本次热身',`${warm.done} / ${warm.available}`,pct(warm.done,warm.available),`跳过 ${warm.skip}`],['恢复记录',`${rec.done} / ${rec.total}`,pct(rec.done,rec.total),'训练日']]; $('#kpis').innerHTML = items.map(([a,b,c,d])=>`<div class="panel kpi"><span>${h(a)}</span><b>${h(b)}</b><div class="progress"><div class="bar" style="width:${c}%"></div></div><span>${c}% · ${h(d)}</span></div>`).join(''); }
function renderHome(){ const s=currentSessionObj(); const params = DATA.params.filter(x=>x.label).map(x=>`<div class="detail-row"><dt>${h(x.label)}</dt><dd>${h(x.value)}</dd></div>`).join(''); $('#home').innerHTML = `<section class="panel"><div class="section-heading"><div class="section-heading-copy"><span class="badge">${h(s.week)} · ${h(formatSessionDay(s.day))}</span><h2 style="margin-top:8px">${h(s.focus)}</h2><p class="sub">${h(s.phase)}</p></div><span class="badge warn">${h(s.required)}</span></div><div class="tools" style="margin-top:14px"><button class="btn primary" data-export-gpt>导出给 GPT</button><button class="btn" data-export-json>完整备份</button><button class="btn" data-clear>清空记录</button></div></section><section class="panel"><h2>本阶段参数</h2><dl class="detail-list">${params}</dl></section>`; $('[data-export-gpt]').addEventListener('click', exportForGpt); $('[data-export-json]').addEventListener('click', exportBackup); $('[data-clear]').addEventListener('click', clearState); }
function renderTraining(){ const rows=sessionRows(DATA.trainingRows); const s=currentSessionObj(); $('#training').innerHTML = `<section class="panel"><div class="section-heading"><div class="section-heading-copy"><span class="badge">${h(s.week)} · ${h(formatSessionDay(s.day))}</span><h2 style="margin-top:8px">${h(s.focus)}</h2></div><span class="badge warn">${rows.length} 个动作</span></div></section><div class="list">${rows.map(trainingCard).join('')}</div>`; bindTraining(); }
function trainingCard(r){ const sets = r.groupChecks.map(g=>{const m=getMark('set',r.id,g); return `<button class="setbtn ${m==='☑'?'done':m==='跳过'?'skip':''}" data-set-id="${h(r.id)}" data-group="${h(g)}" aria-label="${h(r.actionName)} ${h(g)} ${h(markLabel(m))}"><span class="check-label">${h(g)}</span><span class="checkdot" aria-hidden="true"></span><span class="check-state sr-only">${h(markLabel(m))}</span></button>`;}).join(''); const fields = [['实际重量','weight'],['实际次数','reps'],['疼痛/异常','pain'],['备注','note']].map(([name,type])=>{ const val=h(getField('training',r.id,name)); const quick=(type==='weight'||type==='reps'||type==='pain') ? `<button class="mini" data-pick="${type}" data-kind="training" data-row="${h(r.id)}" data-name="${h(name)}">选择</button>` : ''; const placeholder=type==='weight'?'如 70 kg':type==='reps'?'如 5':type==='pain'?'0-10 或描述':'补充记录'; const input = name==='备注' ? `<textarea placeholder="${placeholder}" data-field-kind="training" data-field-row="${h(r.id)}" data-field-name="${h(name)}">${val}</textarea>` : `<input type="text" placeholder="${placeholder}" inputmode="${type==='weight'||type==='reps'||type==='pain'?'decimal':'text'}" data-field-kind="training" data-field-row="${h(r.id)}" data-field-name="${h(name)}" value="${val}">`; return `<label class="${name==='备注'||name==='疼痛/异常'?'field-wide':''}"><span>${h(name)}</span><div class="inputline">${input}${quick}</div></label>`; }).join(''); return `<article class="rowcard" data-row-id="${h(r.id)}"><div class="exercise-head"><span class="exercise-order">${h(r.order)}</span><div class="exercise-title"><div class="name">${h(r.actionName)}</div><span class="stage-pill">${h(r.stage)}</span></div><div class="target-box"><strong>${h(r.targetLoad)}</strong><small>${h(r.sets)}组 × ${h(r.reps)}</small></div></div><p class="cue">${h(r.intensity)}</p><div class="sets">${sets}</div><div class="fields">${fields}</div></article>`; }
function bindTraining(){ $('#training').querySelectorAll('[data-set-id]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.setId,g=b.dataset.group,m=cycle(getMark('set',id,g)); setMark('set',id,g,m); renderTraining();})); bindFields('#training'); bindPickers('#training'); }
function renderWarmup(){ const rows=sessionRows(DATA.warmupRows); const s=currentSessionObj(); $('#warmup').innerHTML = `<section class="panel"><div class="section-heading"><div class="section-heading-copy"><span class="badge">${h(s.week)} · ${h(formatSessionDay(s.day))}</span><h2 style="margin-top:8px">热身与腰背/肩锁保护</h2></div><span class="badge warn">${rows.length} 项</span></div></section><div class="list">${rows.map(warmRow).join('')}</div>`; $('#warmup').querySelectorAll('[data-warm]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.warm,m=cycle(getMark('warm',id,'')); setMark('warm',id,'',m); renderWarmup(); renderKpis();})); }
function warmRow(r){const m=getMark('warm',r.id,''); return `<article class="rowcard warm-card"><div class="warm-head"><div class="warm-title"><span class="stage-pill">热身</span><div class="name">${h(r.actionName)}</div></div><button class="setbtn ${m==='☑'?'done':m==='跳过'?'skip':''}" data-warm="${h(r.id)}" aria-label="${h(r.actionName)} ${h(markLabel(m))}"><span class="checkdot" aria-hidden="true"></span><span class="check-label">${h(markLabel(m))}</span></button></div><div class="warm-info"><div class="info-block"><span>剂量</span>${h(r.dose)}</div><div class="info-block"><span>目的与感觉</span>${h(r.purpose)}<br>${h(r.feeling)}</div><div class="info-block"><span>需要降档时</span>${h(r.downshift)}</div></div></article>`;}
function renderRecovery(){ const rows=sessionRows(DATA.recoveryRows); const s=currentSessionObj(); $('#recovery').innerHTML = `<section class="panel"><div class="section-heading"><div class="section-heading-copy"><span class="badge">${h(s.week)} · ${h(formatSessionDay(s.day))}</span><h2 style="margin-top:8px">训练恢复记录</h2></div></div></section><div class="list">${rows.map(recoveryRow).join('')}</div>`; $('#recovery').querySelectorAll('[data-recovery]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.recovery,m=cycle(getMark('recovery',id,'')); setMark('recovery',id,'',m); renderRecovery(); renderKpis();})); bindFields('#recovery'); bindPickers('#recovery'); }
function recoveryRow(r){ const m=getMark('recovery',r.id,''); const fields = r.fields.map(name=>{const def=name==='疱疹前驱'?r.defaultProdrome:''; const val=h(getField('recovery',r.id,name,def)); const type=name.includes('1–5')?'energy':name.includes('0–10')?'pain':name.includes('入睡')?'time':'text'; const quick=(type==='pain'||type==='energy'||type==='time')?`<button class="mini" data-pick="${type}" data-kind="recovery" data-row="${h(r.id)}" data-name="${h(name)}">选择</button>`:''; const input=name==='备注'?`<textarea data-field-kind="recovery" data-field-row="${h(r.id)}" data-field-name="${h(name)}">${val}</textarea>`:`<input type="text" data-field-kind="recovery" data-field-row="${h(r.id)}" data-field-name="${h(name)}" value="${val}">`; return `<label class="${name==='备注'||name==='疱疹前驱'?'field-wide':''}"><span>${h(name)}</span><div class="inputline">${input}${quick}</div></label>`;}).join(''); return `<article class="track-row"><div class="track-head"><div><span class="badge">${h(r.week)} · ${h(formatSessionDay(r.day))}</span><h3 style="margin-top:8px">${h(r.required)}恢复记录</h3></div><button class="setbtn ${m==='☑'?'done':m==='跳过'?'skip':''}" data-recovery="${h(r.id)}"><span class="checkdot" aria-hidden="true"></span><span class="check-label">${h(markLabel(m))}</span></button></div><div class="fields">${fields}</div></article>`; }
function renderPullup(){ const week=currentSessionObj().weekNumber; const row=DATA.pullupRows.find(r=>r.weekNumber===week) || DATA.pullupRows[0]; $('#pullup').innerHTML = `<section class="panel"><div class="section-heading"><div class="section-heading-copy"><span class="badge">${h(row.week)}</span><h2 style="margin-top:8px">引体进度</h2><p class="sub">本周力量、离心控制与悬垂表现</p></div></div></section><div class="list">${pullRow(row)}</div>`; bindFields('#pullup'); bindPickers('#pullup'); }
function pullRow(r){ const names=['体重kg','高位下拉8次重量','高位下拉6次重量','坐姿划船10次重量','海豹卧拉8次重量','离心最长秒数','肩胛引体次数','悬垂秒数','标准引体完成情况','备注']; const fields=names.map(name=>{const val=h(getField('pullup',r.id,name,r.defaults[name]||'')); const type=name.includes('重量')||name.includes('秒')||name.includes('次数')||name.includes('体重')?'decimal':'text'; const quick=(type==='decimal')?`<button class="mini" data-pick="${name.includes('秒')?'seconds':name.includes('次数')?'reps':'weight'}" data-kind="pullup" data-row="${h(r.id)}" data-name="${h(name)}">选择</button>`:''; const input=name==='备注'?`<textarea data-field-kind="pullup" data-field-row="${h(r.id)}" data-field-name="${h(name)}">${val}</textarea>`:`<input type="text" inputmode="${type==='decimal'?'decimal':'text'}" data-field-kind="pullup" data-field-row="${h(r.id)}" data-field-name="${h(name)}" value="${val}">`; return `<label class="${name==='备注'||name==='标准引体完成情况'?'field-wide':''}"><span>${h(name)}</span><div class="inputline">${input}${quick}</div></label>`;}).join(''); return `<article class="track-row"><div class="fields">${fields}</div></article>`; }
function renderRules(){ const rows=DATA.rules.filter(r=>r.metric).map(r=>`<div class="trow"><div class="cell" data-label="指标"><b>${h(r.metric)}</b></div><div class="cell rule-green" data-label="绿色">${h(r.green)}</div><div class="cell rule-yellow" data-label="黄色">${h(r.yellow)}</div><div class="cell rule-red" data-label="红色">${h(r.red)}</div><div class="cell rule-next" data-label="下一步">${h(r.next)}</div></div>`).join(''); $('#rules').innerHTML = `<section class="panel"><h2>强度与降档规则</h2><p class="sub">按身体状态和动作质量选择当天训练强度。</p></section><div class="table rules"><div class="trow head"><div class="cell">指标</div><div class="cell">绿色</div><div class="cell">黄色</div><div class="cell">红色</div><div class="cell">下一步</div></div>${rows}</div>`; }
function bindFields(root){document.querySelectorAll(`${root} [data-field-row]`).forEach(el=>el.addEventListener('input',()=>setField(el.dataset.fieldKind,el.dataset.fieldRow,el.dataset.fieldName,el.value)));} function bindPickers(root){document.querySelectorAll(`${root} [data-pick]`).forEach(b=>b.addEventListener('click',()=>openPicker(b.dataset.kind,b.dataset.row,b.dataset.name,b.dataset.pick)));}
function optionsFor(type){ if(type==='weight') return Array.from({length:81},(_,i)=>`${(i*2.5).toFixed(i%2?1:0)} kg`); if(type==='reps') return Array.from({length:31},(_,i)=>String(i)); if(type==='pain') return Array.from({length:11},(_,i)=>String(i)); if(type==='energy') return Array.from({length:5},(_,i)=>String(i+1)); if(type==='time') return ['23:00','23:30','00:00','00:30','01:00','01:30','02:00','02:30','03:00']; if(type==='seconds') return Array.from({length:61},(_,i)=>`${i}秒`); return []; }
function openPicker(kind,rowId,name,type){pickerTarget={kind,rowId,name}; const opts=optionsFor(type); $('#pickerTitle').textContent=name; $('#pickerSelect').innerHTML=opts.map(v=>`<option>${h(v)}</option>`).join(''); $('#pickerSheet').classList.add('show'); $('#pickerSheet').setAttribute('aria-hidden','false');} function closePicker(){pickerTarget=null; $('#pickerSheet').classList.remove('show'); $('#pickerSheet').setAttribute('aria-hidden','true');} function applyPicker(){if(!pickerTarget)return; setField(pickerTarget.kind,pickerTarget.rowId,pickerTarget.name,$('#pickerSelect').value); closePicker(); renderTraining(); renderRecovery(); renderPullup();}
function trainingExportRows(){return DATA.trainingRows.map(r=>{const setStates=r.groupChecks.map(g=>({group:g,state:markLabel(getMark('set',r.id,g))})); return {week:r.week,day:r.day,focus:r.focus,stage:r.stage,actionName:r.actionName,targetLoad:r.targetLoad,plannedSets:r.sets,plannedReps:r.reps,intensity:r.intensity,setStates,actualWeight:getField('training',r.id,'实际重量'),actualReps:getField('training',r.id,'实际次数'),painOrIssue:getField('training',r.id,'疼痛/异常'),note:getField('training',r.id,'备注')};});}
function recoveryExportRows(){return DATA.recoveryRows.map(r=>{const values={}; for(const f of r.fields) values[f]=getField('recovery',r.id,f,f==='疱疹前驱'?r.defaultProdrome:''); return {week:r.week,day:r.day,completed:markLabel(getMark('recovery',r.id,'')),...values};});} function pullupExportRows(){return DATA.pullupRows.map(r=>{const values={week:r.week}; for(const k of Object.keys(r.defaults)) values[k]=getField('pullup',r.id,k,r.defaults[k]||''); return values;});}
function exportForGpt(){ const payload={app:DATA.shortTitle,source:DATA.source,exportedAt:new Date().toISOString(),note:'训练记录已包含动作名称 actionName，便于GPT识别；不要只看id。',trainingRecords:trainingExportRows(),recoveryRecords:recoveryExportRows(),pullupProgress:pullupExportRows()}; download(JSON.stringify(payload,null,2),'第3阶段训练记录_给GPT.json','application/json'); toast('已导出：含动作名称的GPT记录'); }
function exportBackup(){download(JSON.stringify({app:DATA.shortTitle,source:DATA.source,exportedAt:new Date().toISOString(),data:DATA,state},null,2),'第3阶段训练计划器_完整备份.json','application/json'); toast('完整备份已导出');} function download(content,name,type){const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);} function clearState(){if(confirm('确定清空本机记录吗？')){state={}; localStorage.removeItem(STORE_KEY); currentSession=DATA.sessions[0]?.id || ''; renderAll(); toast('已清空本机记录');}} function toast(msg){const el=$('#toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200);} function renderAll(){renderSessions(); renderKpis(); renderHome(); renderTraining(); renderWarmup(); renderRecovery(); renderPullup(); renderRules(); switchView(activeView);} init(); renderAll();
</script>
</body>
</html>
